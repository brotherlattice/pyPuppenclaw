[build-system]
requires = ["setuptools>=80", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pypuppenclaw"
dynamic = ["version"]
description = "Python wrapper and managed daemon client for Puppenclaw"
readme = "README.md"
authors = [
    { name = "Philipp Flotho" }
]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "platformdirs>=4.3.0,<5.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "tomli-w>=1.0.0,<2.0.0",
]

[project.scripts]
pypuppenclaw = "pypuppenclaw.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
docs = [
    "sphinx~=7.4",
    "myst-parser~=4.0",
    "linkify-it-py~=2.0",
    "sphinx-copybutton~=0.5",
    "sphinx-design~=0.6",
    "pydata-sphinx-theme~=0.15",
    "sphinx-autodoc-typehints~=2.3",
]
dev = [
    "build>=1.2.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.8.6",
    "twine>=5.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypuppenclaw = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/pypuppenclaw/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov=pypuppenclaw --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "live: requires a real Puppenclaw checkout and local Node runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
