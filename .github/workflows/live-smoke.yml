name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      puppenclaw_repository:
        description: "Repository to check out for the Puppenclaw source tree"
        required: true
        type: string
      puppenclaw_ref:
        description: "Optional ref for the Puppenclaw checkout"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.puppenclaw_repository }}
          ref: ${{ inputs.puppenclaw_ref }}
          path: puppenclaw-source
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: puppenclaw-source/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e .[dev]
      - run: npm install
        working-directory: puppenclaw-source
      - run: npm run build
        working-directory: puppenclaw-source
      - run: pytest -m live
        env:
          PYPUPPENCLAW_LIVE: "1"
          PUPPENCLAW_SOURCE_DIR: ${{ github.workspace }}/puppenclaw-source
